<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#efebe4" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <title>Aryan Patil — Frontend Developer | React &amp; Tailwind</title>
    <meta
      name="description"
      content="Aryan Patil is a frontend developer from Nagpur, Maharashtra specializing in React and Tailwind CSS, building fast and responsive websites."
    />
    <meta property="og:title" content="Aryan Patil — Frontend Developer" />
    <meta property="og:description" content="Fast, responsive websites built with React and Tailwind CSS." />
    <meta property="og:image" content="/aryan.jpeg" />
    <meta property="og:type" content="website" />

    <!-- fonts are self-hosted: no third-party request, no render-blocking CSS -->
    <link rel="preload" href="/fonts/anton.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin />

    <script>
      // apply the saved theme before first paint so there is no flash
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="grain">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
